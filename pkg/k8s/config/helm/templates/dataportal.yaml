{{- define "epos.dataportalConfigData" -}}
BASE_URL: {{ include "epos.platformBasePath" . }}
API_HOST: http://gateway:5000/api
AUTH_ROOT_URL: {{ include "epos.aaiAuthRootURL" . | quote }}
{{- end -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataportal
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataportal
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dataportal
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dataportal
      annotations:
        checksum/dataportal-config: {{ include "epos.dataportalConfigData" . | sha256sum }}
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      initContainers:
      {{- include "epos.waitForServiceInitContainer" (dict "name" "gateway" "port" 5000) | nindent 6 }}
      containers:
      - name: dataportal
        image: {{ .Values.images.dataportal_image }}
        {{- include "epos.image_pull_policy" . | nindent 8 }}
        envFrom:
        - configMapRef:
            name: dataportal
        ports:
        - containerPort: 80
          name: http
        {{- include "epos.nodeSelector" . | nindent 6 }}
        {{- include "epos.tolerations" . | nindent 6 }}
        {{- include "epos.affinity" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dataportal
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataportal
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dataportal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataportal
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataportal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: {{ include "epos.platformBasePath" . }}

    {{- if and .Values.components.platform_gui.tls.enabled .Values.cert_manager_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.cert_manager_issuer }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: {{ include "epos.platformBasePath" . }}
        pathType: Prefix
        backend:
          service:
            name: dataportal
            port:
              number: 80
  {{- if .Values.components.platform_gui.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.components.platform_gui.tls.secret_name }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataportal
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataportal
data:
  {{- include "epos.dataportalConfigData" . | nindent 2 }}
